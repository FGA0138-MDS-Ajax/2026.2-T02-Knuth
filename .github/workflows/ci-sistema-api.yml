name: CI - Teste de Sistema da API

on:
  pull_request:
    branches: [developer, main]
  push:
    branches: [developer, main]

jobs:
  teste-sistema-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: rotasdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d rotasdf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:sistema
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: adminpassword
