openapi: 3.0.3
info:
  title: RotasDF API
  description: API REST para a plataforma de transporte público RotasDF. Desenvolvido pela equipe Knuth (T02_KNUTH).
  version: 1.2.0
  contact:
    name: Equipe de Desenvolvimento Knuth
servers:
  - url: https://api.rotasdf.com.br/api/v1
    description: Servidor de Produção (PaaS)
  - url: http://localhost:3000/api/v1
    description: Ambiente de Desenvolvimento Local (Docker)

paths:
  /linhas:
    get:
      summary: Busca linhas de ônibus
      description: Retorna linhas filtradas por nome ou número (RF07).
      parameters:
        - in: query
          name: busca
          schema:
            type: string
          description: Nome ou número da linha
      responses:
        '200':
          description: Sucesso. Retorna a lista de linhas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Linha'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /linhas/{id}/itinerario:
    get:
      summary: Consultar Itinerário
      description: Retorna a sequência de paradas de uma linha agrupadas por sentido (RF08).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      responses:
        '200':
          description: Itinerário agrupado por sentido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItinerarioResponse'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /linhas/{id}/horarios:
    get:
      summary: Consultar Horários
      description: Retorna os horários de partida de uma linha agrupados por sentido e tipo de dia (RF10).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      responses:
        '200':
          description: Quadro de horários agrupado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosResponse'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /trajetos:
    get:
      summary: Busca de Trajetos
      description: Calcula e retorna as opções de trajeto entre uma origem e um destino (RF01, RF02).
      parameters:
        - in: query
          name: origem
          required: true
          schema:
            type: string
          description: Nome da parada de origem
        - in: query
          name: destino
          required: true
          schema:
            type: string
          description: Nome da parada de destino
      responses:
        '200':
          description: Lista de opções de trajeto encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpcaoTrajeto'
        '400':
          description: Erro de validação nos parâmetros (Ex. origem ou destino ausentes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /paradas/proximas:
    get:
      summary: Busca a parada mais próxima
      description: Retorna a parada mais próxima dada uma coordenada de GPS (RF03) com alertas vigentes associados (RF14).
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
          description: Latitude do dispositivo
        - in: query
          name: lng
          required: true
          schema:
            type: number
          description: Longitude do dispositivo
      responses:
        '200':
          description: Parada encontrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParadaProxima'
        '400':
          description: Latitude ou longitude ausentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /alertas:
    get:
      summary: Consultar alertas vigentes
      description: Retorna os alertas vigentes no serviço (RF13), podendo ser filtrados por linhaId e/ou paradaId (RF14).
      parameters:
        - in: query
          name: linhaId
          schema:
            type: string
          description: Código(s) de linha separado(s) por vírgula
        - in: query
          name: paradaId
          schema:
            type: string
          description: ID(s) de parada separado(s) por vírgula
      responses:
        '200':
          description: Lista de alertas vigentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alerta'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /alertas/{id}:
    get:
      summary: Consultar alerta vigente por ID
      description: Retorna detalhes de um alerta vigente específico (RF13).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alerta encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerta'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

components:
  responses:
    ErroInterno:
      description: Erro interno no servidor.
      content:
        application/json:
          schema:
        $ref: '#/components/schemas/Erro'
    ErroNaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
        $ref: '#/components/schemas/Erro'

  schemas:
    Linha:
      type: object
      properties:
        id:
          type: string
        codigo:
          type: string
        nome:
          type: string
        cor:
          type: string
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'

    ItinerarioResponse:
      type: object
      properties:
        linhaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        cor:
          type: string
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
        itinerario:
          type: object
          properties:
            IDA:
              type: array
              items:
                $ref: '#/components/schemas/ParadaItinerario'
            VOLTA:
              type: array
              items:
                $ref: '#/components/schemas/ParadaItinerario'

    ParadaItinerario:
      type: object
      properties:
        sequencia:
          type: integer
        paradaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'

    HorariosResponse:
      type: object
      properties:
        linhaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
        quadroHorarios:
          type: object
          properties:
            IDA:
              $ref: '#/components/schemas/HorariosPorDia'
            VOLTA:
              $ref: '#/components/schemas/HorariosPorDia'

    HorariosPorDia:
      type: object
      properties:
        DIA_UTIL:
          type: array
          items:
            type: string
        SABADO:
          type: array
          items:
            type: string
        DOMINGO_FERIADO:
          type: array
          items:
            type: string

    OpcaoTrajeto:
      type: object
      properties:
        partida:
          type: string
          example: "05:00"
        chegada:
          type: string
          example: "05:15"
        duracaoMinutos:
          type: integer
          example: 15
        baldeacoes:
          type: integer
          example: 0
        caminhadaMetros:
          type: integer
          example: 0
        afetadaPorAlerta:
          type: boolean
          example: false
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
        etapas:
          type: array
          items:
            $ref: '#/components/schemas/Etapa'

    Etapa:
      type: object
      properties:
        ordem:
          type: integer
          example: 1
        duracaoMinutos:
          type: integer
          example: 15
        instrucao:
          type: string
          example: 'Embarque na linha 0.600 em "TERMINAL DO GAMA" e desça em "RODOVIARIA" após 5 paradas.'
        tipo:
          type: string
          enum: [CAMINHADA, ONIBUS]

    ParadaProxima:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        distancia:
          type: number
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'

    Alerta:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum: [DESVIO, SUSPENSAO, ALTERACAO_HORARIO, PARALISACAO]
        titulo:
          type: string
        descricao:
          type: string
        data_inicio:
          type: string
        data_fim:
          type: string
        linhas_afetadas:
          type: array
          items:
            type: object
        paradas_afetadas:
          type: array
          items:
            type: object

    Erro:
      type: object
      properties:
        erro:
          type: string
          example: "NOT_FOUND"
        detalhes:
          type: string
          example: "Recurso não encontrado."