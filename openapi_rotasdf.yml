openapi: 3.0.3
info:
  title: RotasDF API
  description: API REST para a plataforma de transporte público RotasDF. Desenvolvido pela equipe Knuth (T02_KNUTH).
  version: 1.2.0
  contact:
    name: Equipe de Desenvolvimento Knuth
servers:
  - url: https://api.rotasdf.com.br/api/v1
    description: Servidor de Produção (PaaS)
  - url: http://localhost:3000/api/v1
    description: Ambiente de Desenvolvimento Local (Docker)

paths:
  /linhas:
    get:
      summary: Busca linhas de ônibus
      description: Retorna linhas filtradas por nome ou número (RF07).
      parameters:
        - in: query
          name: busca
          schema:
            type: string
          description: Nome ou número da linha
      responses:
        '200':
          description: Sucesso. Retorna a lista de linhas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Linha'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /linhas/{id}/itinerario:
    get:
      summary: Consultar Itinerário
      description: Retorna a sequência de paradas de uma linha agrupadas por sentido (RF08).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      responses:
        '200':
          description: Itinerário agrupado por sentido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItinerarioResponse'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /linhas/{id}/horarios:
    get:
      summary: Consultar Horários
      description: Retorna os horários de partida de uma linha agrupados por sentido e tipo de dia (RF10).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      responses:
        '200':
          description: Quadro de horários agrupado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosResponse'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /trajetos:
    get:
      summary: Busca de Trajetos
      description: Calcula e retorna as opções de trajeto entre uma origem e um destino (RF01, RF02).
      parameters:
        - in: query
          name: origem
          required: true
          schema:
            type: string
          description: Nome da parada de origem
        - in: query
          name: destino
          required: true
          schema:
            type: string
          description: Nome da parada de destino
      responses:
        '200':
          description: Lista de opções de trajeto encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpcaoTrajeto'
        '400':
          description: Erro de validação nos parâmetros (Ex. origem ou destino ausentes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /paradas:
    get:
      summary: Busca paradas por nome (autocomplete)
      description: Retorna paradas correspondentes ao termo buscado, ignorando acentos e maiúsculas/minúsculas, para sugestão na busca de trajetos.
      parameters:
        - in: query
          name: busca
          required: false
          schema:
            type: string
          description: Termo de busca com pelo menos 2 caracteres (ex. Rodoviária, UnB, Taguatinga)
        - in: query
          name: limite
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 25
          description: Quantidade máxima de paradas retornadas
      responses:
        '200':
          description: Lista de paradas correspondentes ao termo buscado.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nome:
                      type: string
                    latitude:
                      type: number
                    longitude:
                      type: number
        '500':
          $ref: '#/components/responses/ErroInterno'

  /paradas/proximas:
    get:
      summary: Busca a parada mais próxima
      description: Retorna a parada mais próxima dada uma coordenada de GPS (RF03) com alertas vigentes associados (RF14).
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
          description: Latitude do dispositivo
        - in: query
          name: lng
          required: true
          schema:
            type: number
          description: Longitude do dispositivo
      responses:
        '200':
          description: Parada encontrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParadaProxima'
        '400':
          description: Latitude ou longitude ausentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /alertas:
    get:
      summary: Consultar alertas vigentes
      description: Retorna os alertas vigentes no serviço (RF13), podendo ser filtrados por linhaId e/ou paradaId (RF14).
      parameters:
        - in: query
          name: linhaId
          schema:
            type: string
          description: Código(s) de linha separado(s) por vírgula
        - in: query
          name: paradaId
          schema:
            type: string
          description: ID(s) de parada separado(s) por vírgula
      responses:
        '200':
          description: Lista de alertas vigentes.
  /usuarios/cadastro:
    post:
      summary: Cadastrar novo passageiro (RF16)
      description: Cria uma conta de passageiro com nome, e-mail e senha criptografada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                  example: "Maria Silva"
                email:
                  type: string
                  format: email
                  example: "maria@email.com"
                senha:
                  type: string
                  example: "senha123"
      responses:
        '201':
          description: Passageiro cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Campos obrigatórios ausentes ou e-mail já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /usuarios/login:
    post:
      summary: Autenticar usuário (RF16)
      description: Autentica o usuário com e-mail e senha e retorna token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
      responses:
        '200':
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  token:
                    type: string
        '401':
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /usuarios/recuperar-senha:
    post:
      summary: Solicitar código de recuperação de senha (RF16)
      description: Gera e envia um código temporário de 6 dígitos para redefinição de senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Solicitação processada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSucesso'
        '400':
          description: E-mail não informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /usuarios/redefinir-senha:
    post:
      summary: Redefinir senha com código de recuperação (RF16)
      description: Valida o código de 6 dígitos recebido e atualiza a senha do passageiro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo, novaSenha]
              properties:
                email:
                  type: string
                  format: email
                codigo:
                  type: string
                  example: "123456"
                novaSenha:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Senha redefinida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSucesso'
        '400':
          description: Dados inválidos, código expirado/incorreto ou limite de tentativas excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /usuarios/me:
    delete:
      summary: Excluir a própria conta de passageiro (RF16)
      description: Remove definitivamente a conta do passageiro autenticado mediante confirmação de senha.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha]
              properties:
                senha:
                  type: string
      responses:
        '200':
          description: Conta excluída com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSucesso'
        '400':
          description: Senha de confirmação não informada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente/inválido ou senha incorreta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Exclusão da própria conta restrita a passageiros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /admin/reportes:
    get:
      summary: Listar reportes de divergência recebidos (RF24)
      description: Lista os reportes enviados pelos passageiros para análise administrativa, com filtros opcionais por status e tipo.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDENTE, PROCEDENTE, IMPROCEDENTE]
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [HORARIO, PARADA, ITINERARIO]
      responses:
        '200':
          description: Lista de reportes encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alerta'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /alertas/{id}:
    get:
      summary: Consultar alerta vigente por ID
      description: Retorna detalhes de um alerta vigente específico (RF13).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alerta encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerta'
                  $ref: '#/components/schemas/ReporteDivergencia'
        '400':
          description: Filtro de status ou tipo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Acesso restrito ao perfil Administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /admin/reportes/{id}:
    get:
      summary: Consultar detalhes de um reporte (RF24)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes do reporte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteDivergencia'
        '400':
          description: ID inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito ao perfil Administrador.
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

    patch:
      summary: Classificar reporte e registrar correção realizada (RF24)
      description: Permite ao administrador classificar o reporte como PENDENTE, PROCEDENTE ou IMPROCEDENTE e registrar a correção realizada ou observação.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDENTE, PROCEDENTE, IMPROCEDENTE]
                observacaoAdmin:
                  type: string
                  description: Obrigatória quando o status for PROCEDENTE (registro da correção realizada).
                  example: "Horário da linha 0.110 atualizado no quadro de dias úteis."
      responses:
        '200':
          description: Análise registrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteDivergencia'
        '400':
          description: ID inválido, status inválido ou ausência da descrição da correção para reporte procedente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito ao perfil Administrador.
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /admin/linhas:
    post:
      summary: Incluir linha manualmente (RF23)
      description: Cadastra uma linha sem aguardar nova importação. O código (apenas números e pontos) também passa a ser o id da linha. Código e nome são obrigatórios.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinhaCadastro'
      responses:
        '201':
          description: Linha incluída com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinhaCadastro'
        '400':
          description: Campos obrigatórios ausentes ou em formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito ao perfil Administrador.
        '409':
          description: Já existe uma linha com o código informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /admin/linhas/{id}:
    put:
      summary: Alterar linha (RF23)
      description: Corrige nome, cor, tarifa, faixa tarifária, operadora e extensão da linha. O nome é obrigatório e o código não pode ser alterado (o campo codigo é ignorado).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinhaCadastro'
      responses:
        '200':
          description: Linha alterada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinhaCadastro'
        '400':
          description: Campos obrigatórios ausentes ou em formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito ao perfil Administrador.
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

    delete:
      summary: Excluir linha (RF23)
      description: Exclui a linha junto com suas viagens, horários e favoritos (exclusão em cascata).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      responses:
        '200':
          description: Linha excluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSucesso'
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito ao perfil Administrador.
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /favoritos:
    get:
      summary: Listar linhas, paradas e trajetos favoritos do passageiro (RF17)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de favoritos do passageiro autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorito'
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito a passageiros.
    post:
      summary: Salvar linha, parada ou trajeto como favorito (RF17)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo:
                  type: string
                  enum: [LINHA, PARADA, TRAJETO]
                linhaId:
                  type: string
                paradaId:
                  type: string
                origem:
                  type: string
                destino:
                  type: string
      responses:
        '201':
          description: Favorito salvo com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorito'
        '400':
          description: Dados inválidos.
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito a passageiros.
        '404':
          description: Linha ou parada não encontrada.
        '409':
          description: Item já está nos favoritos.

  /favoritos/{id}:
    delete:
      summary: Remover item dos favoritos (RF17)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Favorito removido com sucesso.
        '400':
          description: ID inválido.
        '401':
          description: Token ausente ou inválido.
        '403':
          description: Acesso restrito a passageiros.
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErroInterno:
      description: Erro interno no servidor.
      content:
        application/json:
          schema:
        $ref: '#/components/schemas/Erro'
    ErroNaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
        $ref: '#/components/schemas/Erro'

  schemas:
    Linha:
      type: object
      properties:
        id:
          type: string
        codigo:
          type: string
        nome:
          type: string
        cor:
          type: string
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'

    ItinerarioResponse:
      type: object
      properties:
        linhaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        cor:
          type: string
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
        itinerario:
          type: object
          properties:
            IDA:
              type: array
              items:
                $ref: '#/components/schemas/ParadaItinerario'
            VOLTA:
              type: array
              items:
                $ref: '#/components/schemas/ParadaItinerario'

    ParadaItinerario:
      type: object
      properties:
        sequencia:
          type: integer
        paradaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'

    HorariosResponse:
      type: object
      properties:
        linhaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
        quadroHorarios:
          type: object
          properties:
            IDA:
              $ref: '#/components/schemas/HorariosPorDia'
            VOLTA:
              $ref: '#/components/schemas/HorariosPorDia'

    HorariosPorDia:
      type: object
      properties:
        DIA_UTIL:
          type: array
          items:
            type: string
        SABADO:
          type: array
          items:
            type: string
        DOMINGO_FERIADO:
          type: array
          items:
            type: string

    OpcaoTrajeto:
      type: object
      properties:
        partida:
          type: string
          example: "05:00"
        chegada:
          type: string
          example: "05:15"
        duracaoMinutos:
          type: integer
          example: 15
        baldeacoes:
          type: integer
          example: 0
        caminhadaMetros:
          type: integer
          example: 0
        afetadaPorAlerta:
          type: boolean
          example: false
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'
        etapas:
          type: array
          items:
            $ref: '#/components/schemas/Etapa'

    Etapa:
      type: object
      properties:
        ordem:
          type: integer
          example: 1
        duracaoMinutos:
          type: integer
          example: 15
        instrucao:
          type: string
          example: 'Embarque na linha 0.600 em "TERMINAL DO GAMA" e desça em "RODOVIARIA" após 5 paradas.'
        tipo:
          type: string
          enum: [CAMINHADA, ONIBUS]

    ParadaProxima:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        distancia:
          type: number
        afetadaPorAlerta:
          type: boolean
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alerta'

    Alerta:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
