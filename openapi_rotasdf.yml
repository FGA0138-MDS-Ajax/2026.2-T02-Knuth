openapi: 3.0.3
info:
  title: RotasDF API
  description: API REST para a plataforma de transporte público RotasDF. Desenvolvido pela equipe Knuth (T02_KNUTH).
  version: 1.2.0
  contact:
    name: Equipe de Desenvolvimento Knuth
servers:
  - url: https://api.rotasdf.com.br/api/v1
    description: Servidor de Produção (PaaS)
  - url: http://localhost:3000/api/v1
    description: Ambiente de Desenvolvimento Local (Docker)

paths:
  /linhas:
    get:
      summary: Busca linhas de ônibus
      description: Retorna linhas filtradas por nome ou número (RF07).
      parameters:
        - in: query
          name: busca
          schema:
            type: string
          description: Nome ou número da linha
      responses:
        '200':
          description: Sucesso. Retorna a lista de linhas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Linha'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /linhas/{id}/itinerario:
    get:
      summary: Consultar Itinerário
      description: Retorna a sequência de paradas de uma linha agrupadas por sentido (RF08).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      responses:
        '200':
          description: Itinerário agrupado por sentido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItinerarioResponse'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /linhas/{id}/horarios:
    get:
      summary: Consultar Horários
      description: Retorna os horários de partida de uma linha agrupados por sentido e tipo de dia (RF10).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Código da linha (ex. 0.110)
      responses:
        '200':
          description: Quadro de horários agrupado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorariosResponse'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /trajetos:
    get:
      summary: Busca de Trajetos
      description: Calcula e retorna as opções de trajeto entre uma origem e um destino (RF01, RF02).
      parameters:
        - in: query
          name: origem
          required: true
          schema:
            type: string
          description: Nome da parada de origem
        - in: query
          name: destino
          required: true
          schema:
            type: string
          description: Nome da parada de destino
      responses:
        '200':
          description: Lista de opções de trajeto encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpcaoTrajeto'
        '400':
          description: Erro de validação nos parâmetros (Ex. origem ou destino ausentes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /paradas/proximas:
    get:
      summary: Busca a parada mais próxima
      description: Retorna a parada mais próxima dada uma coordenada de GPS (RF03).
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
          description: Latitude do dispositivo
        - in: query
          name: lng
          required: true
          schema:
            type: number
          description: Longitude do dispositivo
      responses:
        '200':
          description: Parada encontrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParadaProxima'
        '400':
          description: Latitude ou longitude ausentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /usuarios/cadastro:
    post:
      summary: Cadastrar novo passageiro (RF16)
      description: Cria uma conta de passageiro com nome, e-mail e senha criptografada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                  example: "Maria Silva"
                email:
                  type: string
                  format: email
                  example: "maria@email.com"
                senha:
                  type: string
                  example: "senha123"
      responses:
        '201':
          description: Passageiro cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Campos obrigatórios ausentes ou e-mail já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /usuarios/login:
    post:
      summary: Autenticar usuário (RF16)
      description: Autentica o usuário com e-mail e senha e retorna token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
      responses:
        '200':
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  token:
                    type: string
        '401':
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /usuarios/recuperar-senha:
    post:
      summary: Solicitar código de recuperação de senha (RF16)
      description: Gera e envia um código temporário de 6 dígitos para redefinição de senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Solicitação processada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSucesso'
        '400':
          description: E-mail não informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /usuarios/redefinir-senha:
    post:
      summary: Redefinir senha com código de recuperação (RF16)
      description: Valida o código de 6 dígitos recebido e atualiza a senha do passageiro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo, novaSenha]
              properties:
                email:
                  type: string
                  format: email
                codigo:
                  type: string
                  example: "123456"
                novaSenha:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Senha redefinida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSucesso'
        '400':
          description: Dados inválidos, código expirado/incorreto ou limite de tentativas excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /usuarios/me:
    delete:
      summary: Excluir a própria conta de passageiro (RF16)
      description: Remove definitivamente a conta do passageiro autenticado mediante confirmação de senha.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha]
              properties:
                senha:
                  type: string
      responses:
        '200':
          description: Conta excluída com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSucesso'
        '400':
          description: Senha de confirmação não informada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente/inválido ou senha incorreta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Exclusão da própria conta restrita a passageiros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErroInterno:
      description: Erro interno no servidor.
      content:
        application/json:
          schema:
        $ref: '#/components/schemas/Erro'
    ErroNaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
        $ref: '#/components/schemas/Erro'

  schemas:
    Linha:
      type: object
      properties:
        id:
          type: string
        codigo:
          type: string
        nome:
          type: string
        cor:
          type: string

    ItinerarioResponse:
      type: object
      properties:
        linhaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        cor:
          type: string
        itinerario:
          type: object
          properties:
            IDA:
              type: array
              items:
                $ref: '#/components/schemas/ParadaItinerario'
            VOLTA:
              type: array
              items:
                $ref: '#/components/schemas/ParadaItinerario'

    ParadaItinerario:
      type: object
      properties:
        sequencia:
          type: integer
        paradaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    HorariosResponse:
      type: object
      properties:
        linhaId:
          type: string
        codigo:
          type: string
        nome:
          type: string
        quadroHorarios:
          type: object
          properties:
            IDA:
              $ref: '#/components/schemas/HorariosPorDia'
            VOLTA:
              $ref: '#/components/schemas/HorariosPorDia'

    HorariosPorDia:
      type: object
      properties:
        DIA_UTIL:
          type: array
          items:
            type: string
        SABADO:
          type: array
          items:
            type: string
        DOMINGO_FERIADO:
          type: array
          items:
            type: string

    OpcaoTrajeto:
      type: object
      properties:
        partida:
          type: string
          example: "05:00"
        chegada:
          type: string
          example: "05:15"
        duracaoMinutos:
          type: integer
          example: 15
        baldeacoes:
          type: integer
          example: 0
        caminhadaMetros:
          type: integer
          example: 0
        afetadaPorAlerta:
          type: boolean
          example: false
        etapas:
          type: array
          items:
            $ref: '#/components/schemas/Etapa'

    Etapa:
      type: object
      properties:
        ordem:
          type: integer
          example: 1
        duracaoMinutos:
          type: integer
          example: 15
        instrucao:
          type: string
          example: 'Embarque na linha 0.600 em "TERMINAL DO GAMA" e desça em "RODOVIARIA" após 5 paradas.'
        tipo:
          type: string
          enum: [CAMINHADA, ONIBUS]

    ParadaProxima:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        distancia:
          type: number

    Erro:
      type: object
      properties:
        erro:
          type: string
          example: "NOT_FOUND"
        detalhes:
          type: string

    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "Maria Silva"
        email:
          type: string
          format: email
          example: "maria@email.com"
        tipo:
          type: string
          enum: [PASSAGEIRO, ADMIN]
          example: "PASSAGEIRO"

    MensagemSucesso:
      type: object
      properties:
        mensagem:
          type: string
          example: "Operação realizada com sucesso."
          example: "Recurso não encontrado."